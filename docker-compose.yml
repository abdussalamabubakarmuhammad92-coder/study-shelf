services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resource_portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d resource_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_data --production &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: change-me-in-production
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: postgres://portal_user:portal_pass@db:5432/resource_portal
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  static_data:
